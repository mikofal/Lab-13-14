<div class="container">
  <mat-card class="form-card">
    <mat-card-header>
      <mat-card-title>Dodaj nową osobę</mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <form (ngSubmit)="save()" class="person-form">
        
        <mat-form-field appearance="fill" class="full-width">
          <mat-label>Imię</mat-label>
          <input matInput [(ngModel)]="person.firstName" name="firstName" required>
        </mat-form-field>

        <mat-form-field appearance="fill" class="full-width">
          <mat-label>Nazwisko</mat-label>
          <input matInput [(ngModel)]="person.familyName" name="familyName" required>
        </mat-form-field>

        <mat-form-field appearance="fill" class="full-width">
          <mat-label>Wiek</mat-label>
          <input matInput type="number" [(ngModel)]="person.age" name="age" required>
        </mat-form-field>

        <h3>Adres</h3>
        <div class="address-row">
          <mat-form-field appearance="outline">
            <mat-label>Miasto</mat-label>
            <input matInput [(ngModel)]="person.address.city" name="city">
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Ulica</mat-label>
            <input matInput [(ngModel)]="person.address.street" name="street">
          </mat-form-field>
        </div>

        <div class="actions">
            <button mat-raised-button color="accent" type="submit">Zapisz</button>
            <button mat-button routerLink="/">Anuluj</button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
