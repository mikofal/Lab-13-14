<div class="container">
  <mat-card class="list-card">
    <mat-card-header>
      <mat-card-title>Lista Osób</mat-card-title>
    </mat-card-header>
    
    <mat-card-content>
      <mat-list>
        @for (p of people; track $index) {
          <mat-list-item>
            <mat-icon matListItemIcon>person</mat-icon>
            <div matListItemTitle>{{ p.firstName }} {{ p.familyName }}</div>
            <div matListItemLine>Wiek: {{ p.age }}, Miasto: {{ p.address.city }}</div>
            
            <button mat-icon-button color="primary" [routerLink]="['/details', p.id]">
              <mat-icon>info</mat-icon>
            </button>
            <button mat-icon-button color="warn" (click)="remove(p)">
              <mat-icon>delete</mat-icon>
            </button>
          </mat-list-item>
          <mat-divider></mat-divider>
        } @empty {
          <p class="empty-state">Brak osób w bazie.</p>
        }
      </mat-list>
    </mat-card-content>

    <mat-card-actions align="end">
      <button mat-raised-button color="primary" routerLink="/add-person">
        <mat-icon>add</mat-icon> Dodaj Osobę
      </button>
    </mat-card-actions>
  </mat-card>
</div>
